<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Missile Grid</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app" class="app">
    <!-- Start Screen -->
    <section id="startScreen" class="screen start-screen active" aria-labelledby="gameTitle">
      <div class="radar-bg" aria-hidden="true"></div>
      <div class="panel">
        <h1 id="gameTitle">Missile Grid</h1>
        <p class="instructions">
          Missiles are incoming. Click or tap to fire interceptors and defend the base.
          Press <strong>Space</strong> for a straight-up shot.
        </p>
        <p class="high-score">High Score: <span id="menuHighScore">0</span></p>
        <button id="playButton" class="btn">Play</button>
      </div>
    </section>

    <!-- Game Screen -->
    <section id="gameScreen" class="screen game-screen" aria-label="Missile Grid gameplay">
      <header class="hud">
        <div class="hud-item">Score: <span id="scoreValue">0</span></div>
        <div class="hud-item">Level: <span id="levelValue">1</span></div>
        <div class="hud-item stability-wrap">
          Stability:
          <div class="stability-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
            <div id="stabilityBar" class="stability-bar"></div>
          </div>
        </div>
        <button id="pauseButton" class="btn btn-small">Pause</button>
      </header>

      <div id="gameArea" class="game-area">
        <div id="gridBackdrop" class="grid-backdrop" aria-hidden="true"></div>
        <div id="entitiesLayer" class="entities-layer"></div>
        <div id="levelUpNotice" class="level-up">LEVEL UP</div>
        <div id="shieldDome" class="shield-dome hidden"></div>
        <div id="base" class="base"></div>
      </div>
    </section>

    <!-- Game Over Screen -->
    <section id="gameOverScreen" class="screen game-over-screen" aria-labelledby="gameOverTitle">
      <div class="panel">
        <h2 id="gameOverTitle">Game Over</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <p>High Score: <span id="endHighScore">0</span></p>
        <div class="actions">
          <button id="restartButton" class="btn">Restart</button>
          <button id="menuButton" class="btn btn-secondary">Back to Menu</button>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
